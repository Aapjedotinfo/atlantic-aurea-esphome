# AVR-brug v1: firmware/avr-bridge/avr-bridge.hex, link van 9600 baud, component aurea_link.
# Wordt geladen door aurea-wp.yaml via `avr_versie: "1"`. Niet los compileren.

substitutions:
  ot_ns: aurea_link
  avr_verwacht: "AVR-brug v1 (firmware/avr-bridge/avr-bridge.hex)"
  # De AVR meldt de dipswitch (PC2); aurea-wp.yaml toont hem bij "Keteltype (dipswitch)".
  dip_bekend: "true"
  # Is er een thermostaat? Aan als de AVR dat meldt, of als er in de laatste 10 s een bericht van de thermostaat
  # (Data-ID 0) binnenkwam.
  thermo_ok: "id(otlink)->get_thermostat_ok() || ([&]() { const int a = id(otlink)->get_ot_age(0, ${ot_ns}::OT_FROM_STAT); return a >= 0 && a <= 10; })()"

uart:
  # ───────────────────────────────────────────────────────────────
  #  Parameterlink naar de eigen ATmega328P in de IC2-socket, die het
  #  OpenTherm-gesprek tussen thermostaat en CV-ketel doorgeeft.
  #
  #  De sporen tussen IC1 en IC2 liggen al op de print, dus dit kost
  #  geen extra bedrading:
  #    GPIO19 <- IC1-socket pin 2, via 4k7 in serie + 10k naar GND
  #    GPIO18 -> IC1-socket pin 3, rechtstreeks
  #
  #  9600 baud: het origineel zette UBRR = 103 met U2X, oftewel 9615
  #  baud bij 8 MHz. Het zendt met 2 stopbits, maar een ontvanger kijkt
  #  alleen naar de eerste, dus 8N1 volstaat hier.
  # ───────────────────────────────────────────────────────────────
  - id: avr_uart
    rx_pin: GPIO19
    tx_pin: GPIO18
    baud_rate: 9600

# De brug naar de thermostaat en de CV-ketel. Alle regellogica zit hier;
# de AVR kent alleen de twee substituties en zijn terugvalgedrag.
aurea_link:
  id: otlink
  uart_id: avr_uart
  update_interval: 2s
  brake_setpoint: 10   # ketelsetpoint bij geblokkeerde bijstook; Atlantic's waarde

# Buitentemperatuur van de warmtepomp aan de thermostaat doorgeven (Data-ID 27): WERKT ALLEEN VANAF AVR v2.
# Bij v1 kon dit wel (override_to_thermostat), maar zonder uit te zetten: de AVR bewaart zijn antwoord tot de stroom eraf
# gaat. Daarom hier uitgeschakeld. Heb je AVR v2, kies dan avr_versie "2".
#
# interval:
#   - interval: 60s
#     then:
#       - lambda: |-
#           const float buiten = id(wp)->get_outside();
#           if (!std::isnan(buiten)) id(otlink)->override_to_thermostat(27, buiten);

switch:
  # Ketelkant (9-11-2026, voor ketels waarbij "Ketel verbonden" uit blijft, bv. Atag): drie handschakelaars. De AVR leest de
  # vlaggen uit het commando van de ESP en meldt de stand terug; de AVR hoeft dus niet opnieuw geflasht. Standaard UIT (= de
  # vaste instelling van de AVR: TX_INVERT_BOILER 0, geen verwisseling). Alleen met avr_versie "1" of "2"; bij "org" bestaat dit niet.
  - platform: template
    name: "Ketel leesrichting omkeren"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:swap-vertical
    turn_on_action:
      - lambda: 'id(otlink)->set_invert_boiler(true);'
    turn_off_action:
      - lambda: 'id(otlink)->set_invert_boiler(false);'

  - platform: template
    name: "Ketel zendpolariteit omkeren"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:swap-vertical
    turn_on_action:
      - lambda: 'id(otlink)->set_invert_tx_boiler(true);'
    turn_off_action:
      - lambda: 'id(otlink)->set_invert_tx_boiler(false);'

  - platform: template
    name: "Kanalen verwisselen"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:swap-horizontal
    turn_on_action:
      - lambda: 'id(otlink)->set_swap_channels(true);'
    turn_off_action:
      - lambda: 'id(otlink)->set_swap_channels(false);'

  # Ketel aan/uit-contact (10-11-2026): voor een ketel die op het droge contact van K3 hangt in plaats van op OpenTherm.
  # K3 (PC5, socket-pin 28) is een relais (Omron G2R-1, 10 A wisselcontact) via T4; de frontschakelaar zit in serie en moet
  # dicht staan, anders trekt K3 nooit aan. Aan = K3 vrijgegeven: de AVR sluit K3 zodra het ketelsetpoint >= 20 C is
  # (met de rem aan geldt het remsetpoint van 10 C, dus K3 open). K3 en de noodbrug nooit samen (gedeelde R27).
  # Verschillen met v2: v1 kent geen apart keteltype; hij blijft OpenTherm op de ketelklemmen zetten (bij een aan/uit-ketel
  # hangt daar niets aan, dus onschuldig) en antwoordt de thermostaat zelf als de ketel niet antwoordt. Valt de ESP weg,
  # dan blijft de vrijgave staan en gaat de rem eraf: K3 volgt dan de thermostaat (zoals het origineel na 240 s).
  # Standaard UIT, dan blijft K3 altijd open (zo was het).
  - platform: template
    name: "Ketel aan-uit-contact"
    id: sw_ketel_aanuit
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:electric-switch-closed
    turn_on_action:
      - lambda: 'id(otlink)->set_demand_enabled(true);'
    turn_off_action:
      - lambda: 'id(otlink)->set_demand_enabled(false);'

binary_sensor:
  # Stand van K3 (PC5) zoals de AVR hem meldt.
  - platform: template
    name: "Ketel aan-uit-contact (K3)"
    lambda: 'return id(otlink)->get_demand_out();'
    entity_category: diagnostic
    icon: mdi:radiator

sensor:
  # Diagnose ketelkant (9-11-2026): zie wat de brug aan de ketelkant ziet. -1 = nog geen data van de AVR.
  - platform: template
    name: "Ketel flanken"
    lambda: 'return (float) id(otlink)->get_boiler_edges();'
    update_interval: 5s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:sine-wave
  - platform: template
    name: "Ketel leesfouten"
    lambda: 'return (float) id(otlink)->get_rx_errors_boiler();'
    update_interval: 5s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
  - platform: template
    name: "Pariteitsfouten"
    lambda: 'return (float) id(otlink)->get_parity_fails();'
    update_interval: 5s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
  - platform: template
    name: "Lijnen ruw"
    lambda: 'return (float) id(otlink)->get_lines_raw();'
    update_interval: 5s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:electric-switch
