substitutions:
  name: "aurea-wp"
  friendly_name: Aurea Warmtepomp

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: mhetesp32minikit
  framework:
    type: arduino

# Chofu 0x19-protocol @ 666 baud (lokale map ./components/chofu_wp)
external_components:
  - source:
      type: local
      path: components

# ─────────────────────────────────────────────────────────────────
#  Hardware UART naar de warmtepomp-controlbox (via de 2x H11D1 opto's)
#  666 baud, 8N1 - buitenunit is master. Zie README.md voor bedrading.
#  RX (GPIO16) <- pin 27 (van WP), via R9(4k7)+10k naar GND.
#  TX (GPIO17) -> pin 26 (naar WP), rechtstreeks op de driver-trap.
# ─────────────────────────────────────────────────────────────────
uart:
  id: wp_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 666

chofu_wp:
  id: wp
  uart_id: wp_uart
  update_interval: 5s   # Regelcyclus
  # Regeling (defaults zijn bewust rustig; zelden nodig aan te passen):
  # dt_low: 4.0          # onderkant gezonde delta-T-band (°C)
  # dt_high: 8.0         # bovenkant: boven deze delta-T niet verder opstoken
  # max_stand: 7
  # step_interval: 120s  # max ±1 stand per 2 min (niet volgas)

logger:

api:
  encryption:
    key: !secret api_encryption

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name}_Hotspot"
    password: !secret fallback_password

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

captive_portal:

# Blauwe onboard LED van de MH-ET MiniKit als status-LED
status_led:
  pin:
    number: GPIO2

# ═══════════════════════════════════════════════════════════════
#  BEDIENING
# ═══════════════════════════════════════════════════════════════

number:
  # PRIMAIRE KNOP: "geef me constant water op X°C" - de controller kiest
  # zelf de stand (0-7) om die aanvoertemperatuur te halen.
  - platform: template
    name: "Setpoint aanvoer"
    id: n_setpoint
    min_value: 20
    max_value: 45
    step: 0.5
    initial_value: 35
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water
    on_value:
      then:
        - lambda: 'id(wp)->set_setpoint(x);'

  # Handmatige override: zet zelf de stand (werkt alleen in modus "handmatig").
  - platform: template
    name: "Handmatige stand"
    id: n_manual_stand
    min_value: 0
    max_value: 7
    step: 1
    initial_value: 1
    optimistic: true
    mode: slider
    icon: mdi:gauge
    on_value:
      then:
        - lambda: 'id(wp)->set_manual_stand((int) x);'

select:
  - platform: template
    name: "Modus"
    options: ["auto", "handmatig"]
    initial_option: "auto"
    optimistic: true
    icon: mdi:refresh-auto
    on_value:
      then:
        - lambda: 'id(wp)->set_auto_mode(x == "auto");'

switch:
  # Master aan/uit. Niet persistent: na reboot staat het systeem altijd aan.
  - platform: template
    name: "Systeem"
    optimistic: true
    restore_mode: ALWAYS_ON
    icon: mdi:power
    turn_on_action:
      - lambda: 'id(wp)->set_system_on(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_system_on(false);'

  # Diagnose: zet de ruwe FRAME-hexlog aan/uit (standaard uit). Handig bij
  # sleutelen aan de bekabeling; laat 'm normaal uit voor een schone log.
  - platform: template
    name: "Debug frames"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    icon: mdi:bug
    turn_on_action:
      - lambda: 'id(wp)->set_raw_debug(true);'
    turn_off_action:
      - lambda: 'id(wp)->set_raw_debug(false);'

button:
  - platform: restart
    name: "Restart ${friendly_name}"

# ═══════════════════════════════════════════════════════════════
#  UITLEZEN
# ═══════════════════════════════════════════════════════════════

sensor:
  - platform: template
    name: "Aanvoer"
    lambda: 'return id(wp)->get_supply();'
    update_interval: 10s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Retour"
    lambda: 'return id(wp)->get_return();'
    update_interval: 10s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Buiten"
    lambda: 'return id(wp)->get_outside();'
    update_interval: 10s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Delta T"
    lambda: 'return id(wp)->get_delta_t();'
    update_interval: 10s
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    name: "Stand"
    lambda: 'return id(wp)->get_stand();'
    update_interval: 10s
    accuracy_decimals: 0
    icon: mdi:gauge

  - platform: template
    name: "Vermogen"
    lambda: 'return id(wp)->get_power();'   # Echt vermogen uit de WP (25.6 W/stap)
    update_interval: 10s
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Compressor"
    lambda: 'return id(wp)->get_wp_speed();'  # Speed setpoint zoals WP rapporteert
    update_interval: 10s
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sine-wave

  # ── Diagnostiek ──
  - platform: uptime
    name: ${name} Uptime
  - platform: wifi_signal
    name: ${name} WiFi Signal
    update_interval: 120s

binary_sensor:
  - platform: template
    name: "Actief"
    lambda: 'return id(wp)->get_running();'
    device_class: running

  - platform: template
    name: "Defrost"
    lambda: 'return id(wp)->get_defrost();'
    icon: mdi:snowflake-melt

  - platform: template
    name: "Communicatie"
    lambda: 'return id(wp)->get_comm_ok();'
    device_class: connectivity
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ${name} ESPHome Version
  - platform: wifi_info
    ip_address:
      name: ${name} IP
    ssid:
      name: ${name} SSID
    bssid:
      name: ${name} BSSID
